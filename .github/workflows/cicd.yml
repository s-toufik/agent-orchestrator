name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: 🧹 LINT
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --frozen

      - name: Run ruff
        run: |
          uv run ruff check .

  typecheck:
    name: 🔍 TYPECHECK
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --frozen

      - name: Run ty
        run: |
          uv run ty check

  test:
    name: 🧪 TEST
    runs-on: ubuntu-latest
    container:
      image: python:3.14
    needs: typecheck
    env:
      APP_ENV: debug
      OTEL_HOST: localhost
      OTEL_PORT: "4317"
      TOOLBOX_URL: http://127.0.0.1:8001/mcp
      LLM_BASE_URL: http://localhost:8090/v1
      DB_SQLITE_CHECKPOINT_HOST: /tmp/ci-orchestrator
      DB_SQLITE_CHECKPOINT_NAME: checkpoint
      DB_MONGO_CHECKPOINT_HOST: localhost
      DB_MONGO_CHECKPOINT_PORT: "27017"
      DB_MONGO_CHECKPOINT_NAME: checkpoint
      DB_MONGO_CHECKPOINT_USERNAME: test
      DB_MONGO_CHECKPOINT_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv sync --frozen

      - name: Run tests
        run: |
          uv run pytest --maxfail=1 --disable-warnings

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: test-reports/

  build:
    name: 🐳 BUILD
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: 🚀 PUBLISH
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          push: true
          tags: |
            toufik142/agent-orchestrator:${{ steps.tag.outputs.tag }}
            toufik142/agent-orchestrator:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
