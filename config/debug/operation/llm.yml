# The models served by the homelab (homelab-infra/llm/config.yml). max_context_tokens is the
# server's --ctx-size. reasoning_effort: null = no thinking, low/medium/high = thinking (Qwen
# only, no levels; sent as chat_template_kwargs.enable_thinking). Thinking is much slower and
# needs a larger max_output_tokens.
# A key cannot contain a dot (OmegaConf reads it as a path): `.` becomes `_` in the key,
# `model` keeps the name the server knows.
operation:
  qwen3-8b:
    name: qwen3-8b
    connector: ${connector.llm_provider}
    type: api
    endpoint: /chat/completions
    method: POST
    parameters:
      model: ${operation.qwen3-8b.name}
      temperature: 0.0
      max_output_tokens: 4096
      max_context_tokens: 16384
      max_iterations: 20
      use_streaming: true
      reasoning_effort: null

  qwen3_5-0_8b:
    name: qwen3_5-0_8b
    connector: ${connector.llm_provider}
    type: api
    endpoint: /chat/completions
